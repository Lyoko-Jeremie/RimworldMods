[package]
name = "image_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
byteorder = "1.5.0"
compact_str = "0.9.0"
crossbeam = "0.8.4"
hashbrown = { version = "0.15.4", features = ["rayon", "serde"] }
hipstr = { version = "0.8.0", features = ["serde"] }
image = { version = "0.25.6", default-features = false, features = [
    "rayon",
    "jpeg",
    "png",
    "dds",
] }
image_dds = { version = "0.7.2", default-features = false, features = [
    "ddsfile",
    "image",
    "encode",
] }
jwalk = "0.8.1"
log = "0.4.27"
memmap2 = "0.9.7"
mimalloc = "0.1.47"
num_cpus = "1.17.0"
once_cell = "1.21.3"
papaya = "0.2.3"
parking_lot = { version = "0.12.4", features = [
    "arc_lock",
    "hardware-lock-elision",
] }
quick-xml = { version = "0.38.0", features = ["serialize"] }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
smallvec = { version = "2.0.0-alpha.11", features = ["serde"] }
sonic-rs = "0.5.3"
walkdir = "2.5.0"
winapi = { version = "0.3.9", features = ["d3d11", "objbase", "winerror"] }
zstd = { version = "0.13.3", features = ["fat-lto", "zstdmt"] }

[lib]
crate-type = ["cdylib"]

[build-dependencies]
csbindgen = { git = "https://github.com/mmusial/csbindgen", branch = "mangle2024" }

[profile.release]
strip = true
lto = true
panic = "abort"